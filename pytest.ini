[pytest]
addopts = --import-mode=importlib
# Each agent's packages live under agents/<name>/src/<name>/ — put those
# src dirs on the path so imports are unique (camera_agent, …) not shared "src".
pythonpath =
    agents/camera_agent/src
    agents/live_streaming_agent/src
    agents/gift_effects_agent/src
    agents/orchestration_agent/src
    agents/content_moderation_agent/src
testpaths =
    foundation/tests
    agents/camera_agent/tests
    agents/live_streaming_agent/tests
    agents/gift_effects_agent/tests
    agents/orchestration_agent/tests
    agents/content_moderation_agent/tests
