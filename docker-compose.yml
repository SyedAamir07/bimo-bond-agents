# Local multi-agent dev stack. Each agent runs as its own container and
# shares one Redis Streams bus (agent:events) so cross-agent delivery works.
#
# Set EVENT_BUS_URL=redis://redis:6379/0 for all agents (default below).
# NestJS can fan domain events into the same stream when AGENT_EVENTS_ENABLED=true.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  camera_agent:
    build:
      context: .
      dockerfile: camera_agent/Dockerfile
    env_file: camera_agent/.env.example
    environment:
      EVENT_BUS_URL: redis://redis:6379/0
      AGENT_EVENTS_STREAM: agent:events
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy

  live_streaming_agent:
    build:
      context: .
      dockerfile: live_streaming_agent/Dockerfile
    env_file: live_streaming_agent/.env.example
    environment:
      EVENT_BUS_URL: redis://redis:6379/0
      AGENT_EVENTS_STREAM: agent:events
    ports:
      - "8082:8080"
    depends_on:
      redis:
        condition: service_healthy

  gift_effects_agent:
    build:
      context: .
      dockerfile: gift_effects_agent/Dockerfile
    env_file: gift_effects_agent/.env.example
    environment:
      EVENT_BUS_URL: redis://redis:6379/0
      AGENT_EVENTS_STREAM: agent:events
    ports:
      - "8083:8080"
    depends_on:
      redis:
        condition: service_healthy

  orchestration_agent:
    build:
      context: .
      dockerfile: orchestration_agent/Dockerfile
    env_file: orchestration_agent/.env.example
    environment:
      EVENT_BUS_URL: redis://redis:6379/0
      AGENT_EVENTS_STREAM: agent:events
    ports:
      - "8084:8080"
    depends_on:
      redis:
        condition: service_healthy
